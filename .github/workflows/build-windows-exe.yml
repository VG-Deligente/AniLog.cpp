name: Build Windows EXE

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build AniLog.exe
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DANILOG_FETCH_GLFW=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Stage executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item build\Release\AniLog.exe dist\AniLog.exe

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: AniLog-Windows
          path: dist/AniLog.exe

      - name: Attach executable to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AniLog.exe
